name: CI

on:
  push:
    branches: [main, master, "claude/**", "integration/**"]
  pull_request:

# Least privilege: the workflow only reads code and uses no secret.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Python 3.9 is not provided on ubuntu-latest (Ubuntu 26.04) any more
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Types
        if: matrix.python-version == '3.13'
        run: mypy
      - run: pytest -q

  # Known vulnerabilities in what the package pulls in for its users (runtime dependencies of pyproject.toml).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Runtime dependencies have no known vulnerability
        run: pip-audit --strict --progress-spinner off .

  # End-to-end (the 12-step scenario of tests/test_e2e.py against the real AIWorkPay server) does NOT run here: this
  # repository is public and cannot read the private backend. It runs in the backend's CI, job "SDK end-to-end", which
  # checks out this repository. A green run of this workflow therefore validates unit, contract and typing only.
