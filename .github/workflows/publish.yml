# Publishes the package to PyPI with Trusted Publishing: no token is stored anywhere.
# One-time setup (see RELEASING.md): register this workflow as a trusted publisher on PyPI.
#
# Publishing is MANUAL ONLY. Creating or publishing a GitHub release does nothing (no `release` trigger).
#   - Manual run, target "testpypi" -> TestPyPI (a dry run that cannot harm anything)
#   - Manual run, target "pypi"     -> PyPI, and only if `confirm` is typed exactly: PUBLISH v<version> TO PYPI
# Two more locks, set on GitHub (see RELEASING.md): the `pypi` environment with a required reviewer, and the PyPI trusted publisher.
name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      confirm:
        description: 'Only for target "pypi": type exactly  PUBLISH v<version> TO PYPI  (for example PUBLISH v2.0.0 TO PYPI)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine

      - name: Versions agree, and a PyPI run was explicitly confirmed
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          version="$(python -c 'exec(open("aiworkpay/_version.py").read()); print(__version__)')"
          declared="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$declared" || { echo "::error::aiworkpay/_version.py ($version) and pyproject.toml ($declared) differ"; exit 1; }
          if [ "$TARGET" = "pypi" ]; then
            test "$CONFIRM" = "PUBLISH v${version} TO PYPI" || { echo "::error::PyPI publication refused: type exactly 'PUBLISH v${version} TO PYPI' in the confirm input"; exit 1; }
          fi

      - run: python -m build
      - run: twine check --strict dist/*

      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import aiworkpay; print(aiworkpay.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.repository == 'AiWorkPay-SASU/AIWorkPay-SDK-v1' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.repository == 'AiWorkPay-SASU/AIWorkPay-SDK-v1' && inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    # Add "required reviewers" to this environment to approve each release by hand
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
